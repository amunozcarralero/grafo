<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot BFS · Tablero + Código + Explicación didáctica</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { padding: 1.25rem; background: #eef2f7; margin: 0; min-height: 100vh; }

  .container {
    display: flex; gap: 1.25rem; flex-wrap: wrap;
    justify-content: center; max-width: 1780px; margin: 0 auto;
    align-items: flex-start;
  }
  .panel {
    background: #fff; border-radius: 14px; padding: 1.1rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  .panel h2 {
    margin: 0 0 .8rem; font-size: 1rem; color: #2c3e50;
    border-bottom: 2px solid #eef2f7; padding-bottom: .5rem;
    display: flex; align-items: center; gap: .4rem;
    flex-shrink: 0;
  }
  .board-panel { flex: 0 0 440px; }
  .code-panel  { flex: 1 1 540px; min-width: 420px; display: flex; flex-direction: column; }

  /* Columna derecha: log + explicación */
  .right-column {
    flex: 0 0 400px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    align-self: stretch;
  }
  .log-panel {
    flex: 0 0 auto;
    max-height: 280px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .log-panel #log {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding-right: .3rem;
  }
  .explanation-panel {
    flex: 0 0 auto;
    max-height: 700px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .explanation-panel #explanation {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding-right: .35rem;
  }

  /* ---------- CONFIGURACIÓN ---------- */
  .config {
    background: #f8f9fa; border-radius: 10px;
    padding: .75rem; margin-bottom: .9rem;
    display: flex; flex-direction: column; gap: .5rem;
    border: 1px solid #e3e8ef;
  }
  .config-title {
    font-size: .72rem; font-weight: 700; color: #7f8c8d;
    text-transform: uppercase; letter-spacing: .6px;
    margin-top: .2rem;
  }
  .config-title:first-child { margin-top: 0; }
  .config-row {
    display: flex; align-items: center; gap: .5rem;
    font-size: .82rem; color: #2c3e50;
  }
  .config-row label { font-weight: 600; }
  .config-row .field {
    display: flex; align-items: center; gap: .25rem;
    background: #fff; border: 1px solid #cbd5e0;
    border-radius: 6px; padding: .22rem .4rem;
  }
  .config-row .field span { color: #7f8c8d; font-size: .72rem; font-weight: 600; }
  .config-row input[type="number"] {
    width: 2.8rem; border: none; outline: none;
    font-size: .88rem; text-align: center; color: #2c3e50;
    font-weight: 600; background: transparent;
    -moz-appearance: textfield;
  }
  .config-row input[type="number"]::-webkit-outer-spin-button,
  .config-row input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .config .btn-apply {
    align-self: flex-start;
    background: #27ae60; padding: .45rem 1.1rem; font-size: .82rem;
  }
  .config .btn-apply:hover:not(:disabled) { background: #219150; }
  .config .btn-generate {
    align-self: flex-start;
    background: #9b59b6; padding: .45rem 1.1rem; font-size: .82rem;
  }
  .config .btn-generate:hover:not(:disabled) { background: #8e44ad; }
  .config-error {
    color: #c0392b; font-size: .78rem; font-weight: 600;
    background: #fdecea; padding: .35rem .6rem;
    border-radius: 6px; border-left: 3px solid #e74c3c;
    display: none;
  }
  .config-error.show { display: block; }

  /* ---------- TABLERO ---------- */
  .board {
    display: grid; background: #2c3e50;
    border-radius: 12px; box-shadow: inset 0 0 0 2px #1a252f;
    margin: 0 auto;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: var(--cell-font, 1.25rem);
    border-radius: 6px; background: #ecf0f1; color: #2c3e50;
    transition: all .3s; user-select: none;
    overflow: hidden; line-height: 1;
  }
  .cell.wall    { background: #34495e; color: #7f8c8d; }
  .cell.robot   { background: #f1c40f; box-shadow: 0 0 0 3px #e67e22 inset; transform: scale(1.05); }
  .cell.visited { background: #85c1e9; }
  .cell.enqueued{ box-shadow: 0 0 0 3px #3498db; }
  .cell.path    { background: #2ecc71; box-shadow: 0 0 0 3px #27ae60 inset; color: #fff; }
  .cell.goal    { box-shadow: 0 0 0 3px #e74c3c inset; }

  .controls { margin-top: 1rem; display: flex; gap: .55rem; flex-wrap: wrap; }
  button {
    padding: .55rem 1rem; border: none; border-radius: 8px;
    background: #3498db; color: #fff; font-weight: 600; font-size: .88rem;
    cursor: pointer; transition: background .2s;
  }
  button:hover:not(:disabled) { background: #2980b9; }
  button:disabled { background: #95a5a6; cursor: not-allowed; }
  button.secondary { background: #7f8c8d; }
  button.secondary:hover:not(:disabled) { background: #576574; }

  .legend {
    margin-top: .9rem; font-size: .75rem; color: #555;
    display: flex; flex-wrap: wrap; gap: .6rem;
  }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend .dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #ccc; }

  /* ---------- CÓDIGO PYTHON ---------- */
  .code-container {
    background: #282c34; border-radius: 10px;
    padding: .6rem 0; flex: 1;
    font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
    font-size: .82rem; line-height: 1.55;
    max-height: 720px; overflow: auto;
    position: relative;
  }
  .code-line {
    display: flex; padding: 0 1rem; white-space: pre;
    transition: background .2s ease, border-color .2s ease;
    border-left: 3px solid transparent;
  }
  .code-line .ln {
    color: #5c6370; min-width: 2.2em; text-align: right;
    margin-right: 1em; user-select: none; flex-shrink: 0;
  }
  .code-line .code { flex: 1; color: #abb2bf; }
  .code-line.secondary {
    background: rgba(241, 196, 15, 0.10);
    border-left-color: rgba(241, 196, 15, 0.55);
  }
  .code-line.primary {
    background: rgba(241, 196, 15, 0.28);
    border-left-color: #f1c40f;
    box-shadow: inset 4px 0 0 #f1c40f;
  }
  .code-line.primary .ln { color: #f1c40f; font-weight: 700; }
  .kw  { color: #c678dd; }
  .fn  { color: #61afef; }
  .str { color: #98c379; }
  .num { color: #d19a66; }
  .com { color: #7f848e; font-style: italic; }

  /* ---------- LOG ---------- */
  #log {
    display: flex; flex-direction: column; gap: 5px;
    font-size: .78rem;
    font-family: 'SF Mono', 'Consolas', monospace;
  }
  .log-entry {
    background: #f8f9fa; padding: 5px 9px;
    border-radius: 6px; border-left: 3px solid #95a5a6;
    line-height: 1.4; word-break: break-word;
  }
  .log-entry.start   { border-left-color: #9b59b6; background: #f5eef8; }
  .log-entry.visit   { border-left-color: #f39c12; background: #fef5e7; }
  .log-entry.enqueue { border-left-color: #3498db; background: #ebf5fb; }
  .log-entry.goal    { border-left-color: #e67e22; background: #fdf2e9; }
  .log-entry.path    { border-left-color: #2ecc71; background: #eafaf1; }
  .log-entry.fail    { border-left-color: #e74c3c; background: #fdedec; }
  .log-step { font-weight: 700; color: #2c3e50; margin-right: .25rem; }

  /* ---------- EXPLICACIÓN ---------- */
  #explanation {
    font-size: .82rem;
    line-height: 1.55;
    color: #2c3e50;
  }
  #explanation.flash {
    animation: flashBg .6s ease-out;
  }
  @keyframes flashBg {
    from { background: #fff5e6; }
    to   { background: transparent; }
  }
  #explanation h3 {
    margin: 0 0 .55rem;
    color: #2c3e50;
    font-size: .92rem;
    padding-bottom: .4rem;
    border-bottom: 2px solid #eef2f7;
  }
  .explain-block {
    background: #f8f9fa;
    border-radius: 8px;
    padding: .6rem .8rem;
    margin-bottom: .55rem;
    border-left: 3px solid #3498db;
  }
  .explain-block.tip  { background: #eafaf1; border-left-color: #27ae60; }
  .explain-block.warn { background: #fef5e7; border-left-color: #f39c12; }
  .explain-block p { margin: .25rem 0; }
  .explain-title {
    font-weight: 700;
    font-size: .7rem;
    color: #2c3e50;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-bottom: .35rem;
  }
  .vars-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .74rem;
    margin-top: .3rem;
  }
  .vars-table td {
    padding: .3rem .4rem;
    border-bottom: 1px solid #e3e8ef;
    vertical-align: top;
  }
  .vars-table tr:last-child td { border-bottom: none; }
  .vars-table td:first-child {
    color: #9b59b6;
    font-weight: 700;
    white-space: nowrap;
    font-family: 'SF Mono', monospace;
    width: 1%;
  }
  .vars-table td:nth-child(2) {
    color: #2c3e50;
    font-weight: 600;
    background: #fff;
    border-radius: 3px;
    padding: .15rem .35rem;
    font-family: 'SF Mono', monospace;
    word-break: break-all;
  }
  .vars-table td:last-child {
    color: #555;
    font-family: system-ui, sans-serif;
    font-size: .78rem;
  }
  .explain-empty {
    color: #7f8c8d;
    font-size: .85rem;
    line-height: 1.6;
    padding: .4rem 0;
  }
  .explain-empty p { margin: 0 0 .5rem; }
  .explain-empty ul { margin: .3rem 0 0 1.2rem; padding: 0; }
  .explain-empty li { margin: .15rem 0; }
  .explain-empty strong { color: #2c3e50; }

  @media (max-width: 1400px) {
    .board-panel, .code-panel, .right-column { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ================= TABLERO + CONFIG ================= -->
  <div class="panel board-panel">
    <h2>🤖 Tablero <span id="dims-label" style="color:#7f8c8d;font-weight:500;font-size:.85rem">4×4</span></h2>

    <div class="config">
      <div class="config-title">📐 Dimensiones del tablero</div>
      <div class="config-row">
        <label>Cantidad de arrays:</label>
        <div class="field"><input type="number" id="rows-input" min="2" max="12" value="4"></div>
      </div>
      <div class="config-row">
        <label>Longitud de los arrays:</label>
        <div class="field"><input type="number" id="cols-input" min="2" max="12" value="4"></div>
      </div>
      <button id="btnGenerate" class="btn-generate">🎲 Generar tablero</button>
      <div class="config-error" id="gen-error"></div>

      <div class="config-title" style="margin-top:.3rem;">🎯 Inicio y fin</div>
      <div class="config-row">
        <label>Inicio:</label>
        <div class="field"><span>F</span><input type="number" id="start-row" min="0" max="3" value="0"></div>
        <div class="field"><span>C</span><input type="number" id="start-col" min="0" max="3" value="0"></div>
      </div>
      <div class="config-row">
        <label>Fin:</label>
        <div class="field"><span>F</span><input type="number" id="end-row" min="0" max="3" value="3"></div>
        <div class="field"><span>C</span><input type="number" id="end-col" min="0" max="3" value="3"></div>
      </div>
      <button id="btnApply" class="btn-apply">✓ Aplicar inicio/fin</button>
      <div class="config-error" id="config-error"></div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
      <button id="btnStart">▶ Iniciar</button>
      <button id="btnStep">⏭ Paso a paso</button>
      <button id="btnReset" class="secondary">🔄 Reiniciar</button>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:#ecf0f1"></span>Libre (0)</span>
      <span><span class="dot" style="background:#34495e"></span>Muro (1)</span>
      <span><span class="dot" style="background:#85c1e9"></span>Visitado</span>
      <span><span class="dot" style="background:#2ecc71"></span>Camino</span>
      <span><span class="dot" style="background:#f1c40f"></span>Robot</span>
    </div>
  </div>

  <!-- ================= CÓDIGO PYTHON ================= -->
  <div class="panel code-panel">
    <h2>🐍 Algoritmo Python (BFS) — celda libre = 0, muro = 1</h2>
    <div class="code-container" id="code-container"></div>
  </div>

  <!-- ================= COLUMNA DERECHA: LOG + EXPLICACIÓN ================= -->
  <div class="right-column">

    <div class="panel log-panel">
      <h2>📋 Instrucciones paso a paso</h2>
      <div id="log"></div>
    </div>

    <div class="panel explanation-panel">
      <h2>📖 Explicación didáctica</h2>
      <div id="explanation"></div>
    </div>

  </div>

</div>

<script>
/* =========================================================
   1. ESTADO GLOBAL
   ========================================================= */
let rows = 4;
let cols = 4;

let grid = [
  [0, 0, 1, 0],
  [1, 0, 1, 0],
  [1, 0, 0, 0],
  [1, 1, 1, 0]
];

let start = [0, 0];
let end   = [3, 3];

/* =========================================================
   2. CÓDIGO PYTHON A MOSTRAR
   ========================================================= */
const pythonCode = [
  "from collections import deque",                                     // 1
  "",                                                                  // 2
  "def bfs(grid, start, end):",                                        // 3
  "    rows, cols = len(grid), len(grid[0])",                          // 4
  "    queue = deque([start])",                                        // 5
  "    visited = set([start])",                                        // 6
  "    prev = {}",                                                     // 7
  "    steps = []",                                                    // 8
  "",                                                                  // 9
  '    steps.append(f"🚀 Inicio en {start}")',                          // 10
  "",                                                                  // 11
  "    while queue:",                                                  // 12
  "        current = queue.popleft()",                                 // 13
  "        r, c = current",                                            // 14
  '        steps.append(f"📍 Visitando {current}")',                    // 15
  "",                                                                  // 16
  "        if current == end:",                                        // 17
  '            steps.append(f"🎯 ¡Objetivo encontrado!")',              // 18
  "            path = []",                                             // 19
  "            node = end",                                            // 20
  "            while node in prev:",                                   // 21
  "                path.append(node)",                                 // 22
  "                node = prev[node]",                                 // 23
  "            path.append(start)",                                    // 24
  "            path.reverse()",                                        // 25
  '            steps.append(f"✅ Camino: {path}")',                     // 26
  "            return path, steps",                                    // 27
  "",                                                                  // 28
  "        for dr, dc in [(-1,0),(1,0),(0,-1),(0,1)]:",                // 29
  "            nr, nc = r + dr, c + dc",                               // 30
  "            if 0 <= nr < rows and 0 <= nc < cols:",                 // 31
  "                neighbor = (nr, nc)",                               // 32
  "                if grid[nr][nc] == 0 and neighbor not in visited:",  // 33
  "                    visited.add(neighbor)",                         // 34
  "                    prev[neighbor] = current",                      // 35
  "                    queue.append(neighbor)",                        // 36
  '                    steps.append(f"➕ Añadido {neighbor}")',          // 37
  "",                                                                  // 38
  '    steps.append("❌ No se encontró camino.")',                      // 39
  "    return None, steps"                                             // 40
];

/* =========================================================
   3. MAPEO PASO → LÍNEAS DE CÓDIGO
   ========================================================= */
const LINE_MAP = {
  start  : { primary: [10],                 secondary: [5, 6, 7] },
  visit  : { primary: [15],                 secondary: [13, 14] },
  goal   : { primary: [17, 18],             secondary: [] },
  path   : { primary: [26],                 secondary: [19,20,21,22,23,24,25] },
  enqueue: { primary: [37],                 secondary: [33,34,35,36] },
  fail   : { primary: [39],                 secondary: [] }
};

/* =========================================================
   4. UTILIDADES
   ========================================================= */
const $ = id => document.getElementById(id);
const escapeHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const KEYWORDS = new Set(['from','import','def','return','if','elif','else','while','for',
  'in','and','or','not','True','False','None','break','continue','lambda','yield','pass',
  'del','is','global','nonlocal','assert','with','as','try','except','finally','raise','class']);
const FUNCTIONS = new Set(['len','set','deque','list','print','range','append','popleft','add','reverse']);

function highlightPy(line) {
  let out = '', i = 0;
  while (i < line.length) {
    const ch = line[i];
    if (ch === '#') { out += `<span class="com">${escapeHtml(line.slice(i))}</span>`; break; }

    const isFStr = ch === 'f' && (line[i+1] === '"' || line[i+1] === "'");
    if (ch === '"' || ch === "'" || isFStr) {
      const s = i;
      const quote = isFStr ? line[i+1] : ch;
      if (isFStr) i++;
      i++;
      while (i < line.length && line[i] !== quote) {
        if (line[i] === '\\' && i + 1 < line.length) i++;
        i++;
      }
      if (i < line.length) i++;
      out += `<span class="str">${escapeHtml(line.slice(s, i))}</span>`;
      continue;
    }

    if (/[a-zA-Z_]/.test(ch)) {
      const s = i;
      while (i < line.length && /[a-zA-Z0-9_]/.test(line[i])) i++;
      const w = line.slice(s, i);
      if (KEYWORDS.has(w)) out += `<span class="kw">${w}</span>`;
      else if (FUNCTIONS.has(w)) out += `<span class="fn">${w}</span>`;
      else out += escapeHtml(w);
      continue;
    }

    if (/\d/.test(ch)) {
      const s = i;
      while (i < line.length && /[\d.]/.test(line[i])) i++;
      out += `<span class="num">${line.slice(s, i)}</span>`;
      continue;
    }

    out += escapeHtml(ch);
    i++;
  }
  return out;
}

/* =========================================================
   5. GENERACIÓN Y VALIDACIÓN DE TABLERO
   ========================================================= */
function isConnected(g, start, end) {
  const r = g.length, c = g[0].length;
  const visited = new Set([start.join(',')]);
  const q = [start];
  while (q.length) {
    const [cr, cc] = q.shift();
    if (cr === end[0] && cc === end[1]) return true;
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nr = cr + dr, nc = cc + dc;
      if (nr >= 0 && nr < r && nc >= 0 && nc < c &&
          g[nr][nc] === 0 && !visited.has(`${nr},${nc}`)) {
        visited.add(`${nr},${nc}`);
        q.push([nr, nc]);
      }
    }
  }
  return false;
}

function generateGrid(r, c) {
  let g, attempts = 0, wallProb = 0.30;
  do {
    g = [];
    for (let i = 0; i < r; i++) {
      const row = [];
      for (let j = 0; j < c; j++) row.push(Math.random() < wallProb ? 1 : 0);
      g.push(row);
    }
    g[0][0] = 0;
    g[r-1][c-1] = 0;
    attempts++;
    if (attempts > 40) wallProb = Math.max(0, wallProb - 0.05);
  } while (!isConnected(g, [0,0], [r-1,c-1]) && attempts < 150);

  if (!isConnected(g, [0,0], [r-1,c-1])) {
    for (let i = 0; i < r; i++) g[i][0] = 0;
    for (let j = 0; j < c; j++) g[r-1][j] = 0;
  }
  return g;
}

/* =========================================================
   6. RENDER
   ========================================================= */
const boardEl = $('board');
const codeEl  = $('code-container');
const logEl   = $('log');
const explEl  = $('explanation');

const DEFAULT_EXPLANATION = `
  <div class="explain-empty">
    <p>👉 Pulsa <strong>▶ Iniciar</strong> o <strong>⏭ Paso a paso</strong> para ver aquí la explicación detallada del paso actual.</p>
    <p>Cada paso mostrará:</p>
    <ul>
      <li>🎬 <strong>Qué está pasando</strong> en el algoritmo</li>
      <li>📦 El <strong>valor actual</strong> de cada variable</li>
      <li>💡 El <strong>razonamiento</strong> detrás de cada acción</li>
    </ul>
  </div>
`;

function applyBoardStyles(r, c) {
  const gap = 4;
  const maxPx = 400;
  const padding = 20;
  const maxDim = Math.max(r, c);
  const cellSize = Math.max(28, Math.min(80,
    Math.floor((maxPx - padding - gap * (maxDim - 1)) / maxDim)));
  const fontSize = Math.max(11, Math.floor(cellSize * 0.4));
  boardEl.style.gridTemplateColumns = `repeat(${c}, ${cellSize}px)`;
  boardEl.style.gridTemplateRows    = `repeat(${r}, ${cellSize}px)`;
  boardEl.style.gap = gap + 'px';
  boardEl.style.padding = (padding / 2) + 'px';
  boardEl.style.setProperty('--cell-font', fontSize + 'px');
}

function renderBoard() {
  applyBoardStyles(rows, cols);
  boardEl.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;

      if (grid[r][c] === 1) { cell.classList.add('wall'); cell.textContent = '1'; }
      else { cell.textContent = '0'; }

      if (r === start[0] && c === start[1]) {
        cell.classList.add('robot');
        cell.textContent = '🤖';
      } else if (r === end[0] && c === end[1]) {
        cell.classList.add('goal');
        if (grid[r][c] !== 1) cell.textContent = '🎯';
      }
      boardEl.appendChild(cell);
    }
  }
  $('dims-label').textContent = `${rows}×${cols}`;
}

function renderCode() {
  codeEl.innerHTML = '';
  pythonCode.forEach((line, idx) => {
    const n = idx + 1;
    const div = document.createElement('div');
    div.className = 'code-line';
    div.id = 'code-line-' + n;
    div.innerHTML = `<span class="ln">${n}</span><span class="code">${highlightPy(line) || '&nbsp;'}</span>`;
    codeEl.appendChild(div);
  });
}

const getCell = (r, c) =>
  boardEl.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);

/* =========================================================
   7. BFS → PASOS CON ESTADO
   ========================================================= */
function snapshot(queue, visited, prev, current, extra) {
  return {
    queue: queue.map(q => [...q]),
    visited: [...visited].sort((a, b) => {
      const [ar, ac] = a.split(',').map(Number);
      const [br, bc] = b.split(',').map(Number);
      return ar - br || ac - bc;
    }),
    prev: Object.fromEntries(prev),
    current: current ? [...current] : null,
    ...(extra || {})
  };
}

function bfsSteps(grid, start, end) {
  const r = grid.length, c = grid[0].length;
  const queue = [[start[0], start[1]]];
  const visited = new Set([start.join(',')]);
  const prev = new Map();
  const steps = [];

  steps.push({
    type: 'start',
    msg: `Inicio en (${start[0]},${start[1]}). Cola: [(${start[0]},${start[1]})]`,
    state: snapshot(queue, visited, prev, null, null)
  });

  while (queue.length > 0) {
    const [cr, cc] = queue.shift();
    const current = [cr, cc];
    steps.push({
      type: 'visit', row: cr, col: cc,
      msg: `Visitando (${cr},${cc})`,
      state: snapshot(queue, visited, prev, current, null)
    });

    if (cr === end[0] && cc === end[1]) {
      steps.push({
        type: 'goal',
        msg: `🎯 Objetivo (${end[0]},${end[1]}) encontrado. Reconstruyendo camino…`,
        state: snapshot(queue, visited, prev, current, null)
      });

      const path = [];
      let node = `${end[0]},${end[1]}`;
      while (prev.has(node)) { path.push(node); node = prev.get(node); }
      path.push(`${start[0]},${start[1]}`);
      path.reverse();

      steps.push({
        type: 'path', path,
        msg: `✅ Camino más corto (${path.length - 1} pasos): ${path.join(' → ')}`,
        state: snapshot(queue, visited, prev, current, { path })
      });
      return steps;
    }

    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nr = cr + dr, nc = cc + dc;
      if (nr >= 0 && nr < r && nc >= 0 && nc < c) {
        const key = `${nr},${nc}`;
        if (grid[nr][nc] === 0 && !visited.has(key)) {
          visited.add(key);
          prev.set(key, `${cr},${cc}`);
          queue.push([nr, nc]);
          steps.push({
            type: 'enqueue', row: nr, col: nc,
            msg: `➕ Añadido (${nr},${nc}) a la cola. Cola: [${queue.map(q => `(${q[0]},${q[1]})`).join(', ')}]`,
            state: snapshot(queue, visited, prev, current, {
              dir: [dr, dc],
              neighbor: [nr, nc],
              parent: [cr, cc]
            })
          });
        }
      }
    }
  }
  steps.push({
    type: 'fail',
    msg: '❌ No se encontró camino.',
    state: snapshot(queue, visited, prev, null, null)
  });
  return steps;
}

/* =========================================================
   8. GENERACIÓN DE LA EXPLICACIÓN DIDÁCTICA
   ========================================================= */
function formatQueue(q) {
  if (q.length === 0) return '(vacía)';
  if (q.length <= 6) return '[' + q.map(x => `(${x[0]},${x[1]})`).join(', ') + ']';
  return `[(${q[0][0]},${q[0][1]}), (${q[1][0]},${q[1][1]}), … +${q.length - 2} más]`;
}

function formatVisited(v) {
  if (v.length === 0) return '(vacío)';
  if (v.length <= 8) return '{' + v.map(k => `(${k})`).join(', ') + '}';
  return `{(${v.slice(0, 4).join('), (')})… +${v.length - 4} más}`;
}

function formatPrev(p) {
  const keys = Object.keys(p);
  if (keys.length === 0) return '(vacío)';
  if (keys.length <= 6) return '{' + keys.map(k => `(${k})→(${p[k]})`).join(', ') + '}';
  return `{… ${keys.length} entradas …}`;
}

function dirNameOf(dr, dc) {
  if (dr === -1) return 'arriba ⬆';
  if (dr ===  1) return 'abajo ⬇';
  if (dc === -1) return 'izquierda ⬅';
  if (dc ===  1) return 'derecha ➡';
  return '?';
}

function generateExplanation(step, n) {
  const s = step.state || {};

  if (step.type === 'start') {
    return `
      <h3>🚀 Paso ${n}: Inicio del algoritmo</h3>
      <div class="explain-block">
        <div class="explain-title">🎬 ¿Qué está pasando?</div>
        <p>BFS se prepara para explorar. Se inicializan las tres estructuras de datos clave y se coloca la <strong>celda inicial</strong> dentro de la cola para que sea la primera en procesarse.</p>
      </div>
      <div class="explain-block">
        <div class="explain-title">📦 Variables iniciales</div>
        <table class="vars-table">
          <tr><td>queue</td><td>${formatQueue(s.queue)}</td><td>Cola <strong>FIFO</strong> con las celdas pendientes de explorar. Primera en entrar, primera en salir.</td></tr>
          <tr><td>visited</td><td>${formatVisited(s.visited)}</td><td>Conjunto de celdas ya descubiertas. Evita repetir visitas y bucles infinitos.</td></tr>
          <tr><td>prev</td><td>${formatPrev(s.prev)}</td><td>Diccionario "<strong>de dónde vengo</strong>". <code>prev[B]=A</code> significa "llegué a B desde A". Servirá para reconstruir el camino.</td></tr>
        </table>
      </div>
      <div class="explain-block tip">
        <div class="explain-title">💡 ¿Por qué BFS?</div>
        <p>BFS (Breadth-First Search) explora <strong>nivel a nivel</strong>: primero todos los vecinos del inicio, luego los vecinos de esos vecinos, y así sucesivamente. Por eso, la primera vez que alcanza el objetivo, el camino encontrado es <strong>el más corto posible</strong> en número de pasos.</p>
      </div>`;
  }

  if (step.type === 'visit') {
    const [cr, cc] = s.current;
    return `
      <h3>📍 Paso ${n}: Visitando (${cr},${cc})</h3>
      <div class="explain-block">
        <div class="explain-title">🎬 ¿Qué está pasando?</div>
        <p>Se extrae la celda del <strong>frente</strong> de la cola con <code>popleft()</code>. Esta celda pasa a ser <code>current</code> y BFS va a inspeccionar sus cuatro vecinos.</p>
      </div>
      <div class="explain-block">
        <div class="explain-title">📦 Variables</div>
        <table class="vars-table">
          <tr><td>current</td><td>(${cr}, ${cc})</td><td>Celda que se está procesando.</td></tr>
          <tr><td>r, c</td><td>${cr}, ${cc}</td><td>Fila y columna de <code>current</code>.</td></tr>
          <tr><td>queue</td><td>${formatQueue(s.queue)}</td><td>Quedan <strong>${s.queue.length}</strong> celdas pendientes.</td></tr>
          <tr><td>visited</td><td>${formatVisited(s.visited)}</td><td>Celdas ya descubiertas.</td></tr>
        </table>
      </div>
      <div class="explain-block tip">
        <div class="explain-title">💡 ¿Qué va a hacer ahora?</div>
        <p>Probará las 4 direcciones (⬆ ⬇ ⬅ ➡). Para cada vecino comprobará tres cosas: ¿está dentro del tablero? ¿es libre (<code>0</code>)? ¿no ha sido visitado ya? Si las tres respuestas son "sí", lo añadirá a la cola.</p>
      </div>`;
  }

  if (step.type === 'enqueue') {
    const [nr, nc] = s.neighbor;
    const [pr, pc] = s.parent;
    const [dr, dc] = s.dir;
    return `
      <h3>➕ Paso ${n}: Añadiendo (${nr},${nc}) a la cola</h3>
      <div class="explain-block">
        <div class="explain-title">🎬 ¿Qué está pasando?</div>
        <p>Estando en (${pr},${pc}), BFS probó la dirección <code>(${dr},${dc})</code> = <strong>${dirNameOf(dr,dc)}</strong>. El vecino resultante (${nr},${nc}) cumple las tres condiciones, así que entra en la cola.</p>
      </div>
      <div class="explain-block">
        <div class="explain-title">📦 Variables</div>
        <table class="vars-table">
          <tr><td>dr, dc</td><td>(${dr}, ${dc})</td><td>Dirección probada. (-1,0)=⬆ · (1,0)=⬇ · (0,-1)=⬅ · (0,1)=➡</td></tr>
          <tr><td>nr, nc</td><td>(${nr}, ${nc})</td><td>Vecino calculado: <code>nr = ${pr}+${dr} = ${nr}</code>, <code>nc = ${pc}+${dc} = ${nc}</code>.</td></tr>
          <tr><td>neighbor</td><td>(${nr}, ${nc})</td><td>Candidato a explorar más tarde.</td></tr>
          <tr><td>grid[${nr}][${nc}]</td><td>0</td><td>✅ Celda libre (no es muro).</td></tr>
          <tr><td>visited</td><td>…</td><td>✅ (${nr},${nc}) no estaba aún en el conjunto.</td></tr>
          <tr><td>prev[${nr},${nc}]</td><td>(${pr},${pc})</td><td>Se registra el padre para reconstruir el camino al final.</td></tr>
          <tr><td>queue</td><td>${formatQueue(s.queue)}</td><td>La celda se añade al <strong>final</strong>.</td></tr>
        </table>
      </div>
      <div class="explain-block tip">
        <div class="explain-title">💡 ¿Por qué al final y no al principio?</div>
        <p>Porque es una <strong>cola</strong>, no una pila. Añadimos con <code>append</code> por el final y sacamos con <code>popleft</code> por delante. Ese orden FIFO es lo que garantiza que BFS explore por niveles y encuentre el camino más corto.</p>
      </div>`;
  }

  if (step.type === 'goal') {
    const [cr, cc] = s.current;
    return `
      <h3>🎯 Paso ${n}: ¡Objetivo alcanzado!</h3>
      <div class="explain-block">
        <div class="explain-title">🎬 ¿Qué está pasando?</div>
        <p>La celda actual (${cr},${cc}) coincide con el destino. BFS detiene la búsqueda y comienza la <strong>reconstrucción del camino</strong>.</p>
      </div>
      <div class="explain-block">
        <div class="explain-title">🔗 ¿Cómo se reconstruye?</div>
        <p>Se parte de <code>node = end</code> y se sigue la cadena <code>node = prev[node]</code> hasta llegar al inicio. Los nodos se apilan en una lista y al final se invierte con <code>reverse()</code>.</p>
      </div>
      <div class="explain-block tip">
        <div class="explain-title">💡 ¿Por qué es el camino más corto?</div>
        <p>Porque BFS garantiza que la primera vez que llega a un nodo, lo hace por el camino más corto. Al detenerse en el destino, esa garantía se hereda al camino reconstruido.</p>
      </div>`;
  }

  if (step.type === 'path') {
    const pathStr = step.path.map(k => `(${k})`).join(' → ');
    return `
      <h3>✅ Paso ${n}: Camino más corto encontrado</h3>
      <div class="explain-block">
        <div class="explain-title">🎬 ¿Qué está pasando?</div>
        <p>El camino completo fue reconstruido y se devuelve como resultado. En el tablero, las celdas del camino se pintan de <strong>verde</strong>.</p>
      </div>
      <div class="explain-block">
        <div class="explain-title">🛤️ Camino</div>
        <p style="font-family: monospace; font-size:.78rem; word-break: break-all;">${pathStr}</p>
        <p><strong>Longitud:</strong> ${step.path.length - 1} pasos · <strong>Nodos:</strong> ${step.path.length}</p>
      </div>
      <div class="explain-block tip">
        <div class="explain-title">🎉 Fin del algoritmo</div>
        <p>BFS ha terminado. El resultado incluye el camino y el registro de pasos que acabas de ver. Como BFS explora por niveles, este es el camino más corto posible entre inicio y fin.</p>
      </div>`;
  }

  if (step.type === 'fail') {
    return `
      <h3>❌ Paso ${n}: No se encontró camino</h3>
      <div class="explain-block">
        <div class="explain-title">🎬 ¿Qué está pasando?</div>
        <p>La cola se vació sin alcanzar el objetivo. BFS exploró <strong>todas las celdas alcanzables</strong> desde el inicio sin encontrar el destino.</p>
      </div>
      <div class="explain-block warn">
        <div class="explain-title">⚠ ¿Por qué ocurre?</div>
        <p>El destino está aislado por muros desde el inicio. Prueba a mover el inicio, el fin o a generar un nuevo tablero con el botón 🎲.</p>
      </div>`;
  }

  return '<p>Paso sin explicación.</p>';
}

/* =========================================================
   9. APLICAR UN PASO (tablero + código + log + explicación)
   ========================================================= */
let currentStepNum = 0;

function clearCodeHighlights() {
  document.querySelectorAll('.code-line.primary, .code-line.secondary')
    .forEach(el => el.classList.remove('primary', 'secondary'));
}

function highlightCodeFor(type) {
  clearCodeHighlights();
  const map = LINE_MAP[type];
  if (!map) return;
  (map.secondary || []).forEach(k => {
    const el = $('code-line-' + k); if (el) el.classList.add('secondary');
  });
  (map.primary || []).forEach(k => {
    const el = $('code-line-' + k); if (el) el.classList.add('primary');
  });
  const first = (map.primary || [])[0];
  if (first) {
    const el = $('code-line-' + first);
    if (el) {
      const cRect = codeEl.getBoundingClientRect();
      const eRect = el.getBoundingClientRect();
      if (eRect.top < cRect.top)            codeEl.scrollTop -= (cRect.top - eRect.top) + 12;
      else if (eRect.bottom > cRect.bottom) codeEl.scrollTop += (eRect.bottom - cRect.bottom) + 12;
    }
  }
}

function addLog(msg, type, stepNum) {
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + (type || '');
  if (stepNum != null) {
    const num = document.createElement('span');
    num.className = 'log-step';
    num.textContent = stepNum + '.';
    entry.appendChild(num);
    entry.appendChild(document.createTextNode(' ' + msg));
  } else {
    entry.textContent = msg;
  }
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateExplanation(html) {
  explEl.innerHTML = html;
  explEl.scrollTop = 0;
  explEl.classList.remove('flash');
  void explEl.offsetWidth;
  explEl.classList.add('flash');
}

function applyStep(step) {
  currentStepNum++;

  if (step.type === 'visit') {
    const cell = getCell(step.row, step.col);
    if (cell && !cell.classList.contains('path') &&
        !cell.classList.contains('robot') && !cell.classList.contains('goal')) {
      cell.classList.add('visited');
    }
  } else if (step.type === 'enqueue') {
    const cell = getCell(step.row, step.col);
    if (cell) {
      cell.classList.add('enqueued');
      setTimeout(() => cell.classList.remove('enqueued'), 500);
    }
  } else if (step.type === 'path') {
    step.path.forEach(key => {
      const [r, c] = key.split(',').map(Number);
      const cell = getCell(r, c);
      if (cell) {
        cell.classList.remove('visited');
        cell.classList.add('path');
        cell.textContent = '●';
      }
    });
    const endCell = getCell(end[0], end[1]);
    if (endCell) { endCell.classList.add('path', 'goal'); endCell.textContent = '🎯'; }
    const startCell = getCell(start[0], start[1]);
    if (startCell) { startCell.classList.add('path', 'robot'); startCell.textContent = '🤖'; }
  }

  highlightCodeFor(step.type);
  addLog(step.msg, step.type, currentStepNum);
  updateExplanation(generateExplanation(step, currentStepNum));
}

/* =========================================================
   10. CONTROLES DE ANIMACIÓN
   ========================================================= */
let stepsQueue = [];
let isAnimating = false;
let animTimer = null;

function resetVisuals() {
  logEl.innerHTML = '';
  explEl.innerHTML = DEFAULT_EXPLANATION;
  clearCodeHighlights();
  currentStepNum = 0;
  renderBoard();
}

function prepareSteps() {
  resetVisuals();
  stepsQueue = bfsSteps(grid, start, end);
}

function stopAnimation() {
  if (animTimer) clearTimeout(animTimer);
  animTimer = null;
  isAnimating = false;
  $('btnStart').disabled = false;
  $('btnStep').disabled = false;
}

function startAnimation(speed = 700) {
  if (isAnimating || stepsQueue.length === 0) return;
  isAnimating = true;
  $('btnStart').disabled = true;
  $('btnStep').disabled = true;
  (function next() {
    if (stepsQueue.length === 0) { stopAnimation(); return; }
    applyStep(stepsQueue.shift());
    animTimer = setTimeout(next, speed);
  })();
}

$('btnStart').addEventListener('click', () => {
  stopAnimation();
  prepareSteps();
  startAnimation(700);
});

$('btnStep').addEventListener('click', () => {
  if (isAnimating) return;
  if (stepsQueue.length === 0) prepareSteps();
  if (stepsQueue.length > 0) applyStep(stepsQueue.shift());
});

$('btnReset').addEventListener('click', () => {
  stopAnimation();
  stepsQueue = [];
  resetVisuals();
});

/* =========================================================
   11. GENERAR TABLERO
   ========================================================= */
function showError(id, msg) {
  const el = $(id);
  el.textContent = '⚠ ' + msg;
  el.classList.add('show');
}
function hideError(id) { $(id).classList.remove('show'); }

function syncStartEndInputBounds() {
  $('start-row').max = rows - 1;
  $('end-row').max   = rows - 1;
  $('start-col').max = cols - 1;
  $('end-col').max   = cols - 1;
}

$('btnGenerate').addEventListener('click', () => {
  const r = parseInt($('rows-input').value, 10);
  const c = parseInt($('cols-input').value, 10);

  if (isNaN(r) || isNaN(c) || r < 2 || c < 2 || r > 12 || c > 12) {
    showError('gen-error', 'La cantidad y longitud de arrays debe estar entre 2 y 12.');
    return;
  }
  hideError('gen-error');
  stopAnimation();
  stepsQueue = [];

  rows = r;
  cols = c;
  grid = generateGrid(rows, cols);
  start = [0, 0];
  end   = [rows - 1, cols - 1];

  $('start-row').value = 0;
  $('start-col').value = 0;
  $('end-row').value   = rows - 1;
  $('end-col').value   = cols - 1;
  syncStartEndInputBounds();

  resetVisuals();
  addLog(`⚙ Tablero generado: ${rows}×${cols} · Inicio (0,0) · Fin (${rows-1},${cols-1})`, 'start', null);
});

/* =========================================================
   12. APLICAR INICIO / FIN
   ========================================================= */
$('btnApply').addEventListener('click', () => {
  const sr = parseInt($('start-row').value, 10);
  const sc = parseInt($('start-col').value, 10);
  const er = parseInt($('end-row').value, 10);
  const ec = parseInt($('end-col').value, 10);

  if ([sr, sc, er, ec].some(v => isNaN(v))) {
    showError('config-error', 'Introduce valores numéricos para fila y columna.');
    return;
  }
  if (sr < 0 || sr >= rows || sc < 0 || sc >= cols ||
      er < 0 || er >= rows || ec < 0 || ec >= cols) {
    showError('config-error',
      `Las coordenadas deben estar en el rango 0..${rows-1} (fila) y 0..${cols-1} (col).`);
    return;
  }
  if (grid[sr][sc] === 1) {
    showError('config-error', `La celda de inicio (${sr},${sc}) es un muro (1). Elige una celda libre (0).`);
    return;
  }
  if (grid[er][ec] === 1) {
    showError('config-error', `La celda de fin (${er},${ec}) es un muro (1). Elige una celda libre (0).`);
    return;
  }
  hideError('config-error');
  stopAnimation();
  stepsQueue = [];

  start = [sr, sc];
  end   = [er, ec];
  resetVisuals();
  addLog(`⚙ Configuración aplicada → Inicio (${sr},${sc}) · Fin (${er},${ec})`, 'start', null);
});

/* Enter en inputs */
['rows-input','cols-input','start-row','start-col','end-row','end-col'].forEach(id => {
  $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (id === 'rows-input' || id === 'cols-input') $('btnGenerate').click();
      else $('btnApply').click();
    }
  });
});

/* =========================================================
   13. INICIALIZACIÓN
   ========================================================= */
renderCode();
renderBoard();
syncStartEndInputBounds();
explEl.innerHTML = DEFAULT_EXPLANATION;
</script>
